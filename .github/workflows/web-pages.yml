name: Deploy web to GitHub Pages

# Publishes the web build to a public URL anyone can open — the only way to try this
# app on iOS without an Apple Developer account.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; finish the running one, queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `enablement: true` turns Pages on for the repo if it is not already, so this
      # needs no manual setup in repository settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # A project site lives at /<repo>/, so the router and every asset URL must be
      # built against that prefix rather than the domain root. base_path comes from
      # the step above so the repo can be renamed without touching this file.
      - name: Export web build
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "base path: ${EXPO_BASE_URL:-<root>}"
          npx expo export --platform web --output-dir dist-web

      # Pages serves 404.html for any unknown path. Making it a copy of index.html is
      # the standard SPA fallback, so refreshing on /bench still loads the app.
      - name: Add SPA fallback
        run: cp dist-web/index.html dist-web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
