<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    G: 咒 with the spark nested inside the character's own negative space.

    Two fixes over C. The vermilion accent moved off the top-right corner — sitting
    there it reads as an unread badge, which is a real cost every time the user glances
    at their home screen. And the strokes went 26 -> 32 so the counters in 口口 still
    hold open at 32px instead of filling in.
  -->
  <defs><linearGradient id="g7" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#245C4C"/><stop offset="1" stop-color="#0E1211"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#g7)"/>
  <g fill="none" stroke="#E5B23F" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <rect x="110" y="122" width="118" height="100" rx="10"/>
    <rect x="284" y="122" width="118" height="100" rx="10"/>
    <path d="M92 276 H420"/>
    <path d="M164 300 V406"/>
    <path d="M348 300 V372 a34 34 0 0 0 34 34 h20"/>
  </g>
  <!--
    The spark lives in the hollow of 兀, so it belongs to the character rather than
    sitting beside it. Centred on the gap between the legs (inner edges 180 and 332)
    and kept clear of both, or the three shapes fuse into one blob at 32px.
  -->
  <path d="M256 306 L268 344 L306 356 L268 368 L256 406 L244 368 L206 356 L244 344 Z" fill="#F05C42"/>
</svg>
