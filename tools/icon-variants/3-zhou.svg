<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    C: the character 咒 itself. Highest recognition for a Chinese-language audience.
    Drawn as geometry, not <text> — an icon must not depend on a CJK font being
    installed, and hand-set strokes hold up at 40px where a font's thin joints fill in.
  -->
  <defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#245C4C"/><stop offset="1" stop-color="#0E1211"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#c)"/>
  <g fill="none" stroke="#E5B23F" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- 口口 -->
    <rect x="107" y="121" width="122" height="104" rx="10"/>
    <rect x="283" y="121" width="122" height="104" rx="10"/>
    <!-- 兀: bar, left leg, hooked right leg -->
    <path d="M96 276 H416"/>
    <path d="M167 296 V404"/>
    <path d="M337 296 V376 a30 30 0 0 0 30 30 h22"/>
  </g>
  <circle cx="416" cy="102" r="19" fill="#F05C42"/>
</svg>
