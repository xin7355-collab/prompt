<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- B: lid ajar, light pouring out. Reads as "open the box and magic comes out". -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E5245"/><stop offset="1" stop-color="#0E1211"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E5B23F" stop-opacity=".95"/>
      <stop offset="1" stop-color="#E5B23F" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#b)"/>
  <path d="M196 306 L150 108 L362 108 L316 306 Z" fill="url(#beam)"/>
  <path d="M256 96 L268 138 L310 150 L268 162 L256 204 L244 162 L202 150 L244 138 Z" fill="#F05C42"/>
  <!-- lid, tilted open -->
  <rect x="112" y="252" width="272" height="40" rx="14" fill="#E5B23F" transform="rotate(-9 248 272)"/>
  <!-- body -->
  <path d="M140 318 h232 v66 a28 28 0 0 1 -28 28 h-176 a28 28 0 0 1 -28 -28 z" fill="#D9A227"/>
  <rect x="140" y="306" width="232" height="26" rx="10" fill="#E5B23F"/>
  <rect x="238" y="344" width="36" height="34" rx="9" fill="#0E1211" opacity=".55"/>
</svg>
