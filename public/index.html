<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover lets the app paint under the notch and home indicator once it
      is installed to the Home Screen; safe-area insets are handled in the app itself.
      user-scalable=no because pinch-zooming a native-style app UI only ever misfires.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!--
      Every URL here is relative so the app works both at a domain root and under a
      project subpath such as /PROMPT-VAULT/ on GitHub Pages. Absolute paths would
      resolve against the domain root and 404 there.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0E1211" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS has no manifest install prompt; these are what Add to Home Screen reads. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="咒語盒" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./favicon.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="description" content="401 則中英雙語 AI 繪圖提示詞、提示詞工作台，以及 26 軸角色工坊。" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #0e1211;
        /* Stops iOS from flashing white while the bundle boots. */
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #eff1ea;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>需要啟用 JavaScript 才能執行這個應用程式。</noscript>
    <div id="root"></div>

    <script>
      // Registered after load so fetching the worker never competes with the bundle.
      // Relative path keeps the scope correct under a project subpath.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            // No offline support is a degraded experience, not a broken one.
          });
        });
      }
    </script>
  </body>
</html>
