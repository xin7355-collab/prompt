<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>咒語盒 · 海報牆</title>
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #151517;
    --panel-2: #1d1d20;
    --line: #2a2a2e;
    --line-soft: #202024;
    --ink: #ecedef;
    --ink-dim: #a2a4aa;
    --ink-faint: #6e7076;
    --accent: #d6452f;
    --gold: #c9a227;
    --serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", Georgia, serif;
    --sans: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ── Header ─────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(11,11,12,0.94);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line-soft);
  }
  .bar { max-width: 1600px; margin: 0 auto; padding: 14px 20px 0; }
  .brandrow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .wordmark {
    font-family: var(--serif); font-size: 22px; font-weight: 700;
    letter-spacing: .06em; margin: 0;
  }
  .tagline { font-size: 11.5px; color: var(--ink-faint); letter-spacing: .04em; }
  .ver {
    font-family: var(--mono); font-size: 10px; color: var(--gold);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; letter-spacing: .04em;
  }
  .spacer { flex: 1; }
  .ghost {
    background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font-size: 12px; color: var(--ink-dim);
  }
  .ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
  .ghost.on { background: var(--gold); border-color: var(--gold); color: #241c00; font-weight: 700; }

  .controls { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .field {
    flex: 1 1 260px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 13px; font-size: 14px; outline: none;
  }
  .field:focus { border-color: var(--ink-faint); }
  .field::placeholder { color: var(--ink-faint); }

  .face {
    display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap;
  }
  #facePreview {
    width: 40px; height: 40px; border-radius: 10px; object-fit: cover;
    border: 1px solid var(--line); display: none;
  }
  .face-btn {
    flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 15px; font-size: 12.5px; color: var(--ink);
    cursor: pointer;
  }
  .face-btn:hover { border-color: var(--ink-faint); }
  .face-clear {
    display: none; background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 13px; font-size: 12px; color: var(--ink-dim); cursor: pointer;
  }
  .face-hint { font-size: 11px; color: var(--ink-faint); line-height: 1.5; }

  .chips {
    display: flex; gap: 7px; overflow-x: auto; padding: 12px 0 13px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; color: var(--ink-dim);
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #0b0b0c; font-weight: 700; }
  .chip .n { font-family: var(--mono); font-size: 10px; opacity: .6; margin-left: 5px; }

  /* ── Grid ───────────────────────────────────────────── */
  main { max-width: 1600px; margin: 0 auto; padding: 22px 20px 80px; }
  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
    transition: border-color .25s, transform .25s;
  }
  .card:hover { border-color: var(--line); transform: translateY(-2px); }

  .shot {
    position: relative; aspect-ratio: 3 / 4; background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line-soft); overflow: hidden;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .placeholder { text-align: center; color: var(--ink-faint); padding: 20px; }
  .placeholder .mark {
    font-family: var(--serif); font-size: 40px; opacity: .28; display: block; margin-bottom: 8px;
  }
  .placeholder .hint {
    font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase;
  }
  .overlay {
    position: absolute; inset: 0; background: rgba(8,8,9,.86);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  .spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.16); border-left-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay .label { font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-dim); }
  .badge {
    position: absolute; left: 10px; top: 10px;
    background: rgba(0,0,0,.6); border-radius: 6px; padding: 3px 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: #fff;
  }

  .body { padding: 15px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .group { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; color: var(--ink-faint); text-transform: uppercase; }
  .name { font-family: var(--serif); font-size: 17px; font-weight: 700; margin: 6px 0 0; }
  .sub { font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
  .desc { font-size: 11.5px; line-height: 1.75; color: var(--ink-dim); margin-top: 9px; }

  .prompt {
    margin-top: 12px; background: #0e0e10; border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 10px 11px;
    font-family: var(--mono); font-size: 10.5px; line-height: 1.72; color: var(--ink-faint);
    max-height: 74px; overflow: hidden; cursor: pointer; position: relative;
  }
  .prompt.open { max-height: none; }
  .prompt:not(.open)::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: linear-gradient(transparent, #0e0e10);
  }

  .actions { display: flex; gap: 8px; margin-top: 13px; }
  .btn {
    flex: 1; border-radius: 9px; padding: 10px; font-size: 12px; font-weight: 700;
    letter-spacing: .12em; border: 1px solid var(--line); background: transparent; color: var(--ink-dim);
  }
  .btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1.35; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .end { text-align: center; padding: 34px 0; color: var(--ink-faint); font-size: 12px; }

  /* ── Overlays ───────────────────────────────────────── */
  .scrim {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.9);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .scrim.show { display: flex; }
  .lightbox { display: flex; flex-direction: column; gap: 12px; max-width: min(94vw, 900px); max-height: 92vh; }
  .lightbox img { max-width: 100%; max-height: 74vh; border-radius: 12px; object-fit: contain; }
  .lightbox .row { display: flex; gap: 9px; }

  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px; width: min(94vw, 480px); max-height: 90vh; overflow: auto;
  }
  .sheet h2 { font-family: var(--serif); font-size: 18px; margin: 0 0 6px; }
  .sheet p { font-size: 12px; line-height: 1.8; color: var(--ink-dim); margin: 0 0 16px; }
  .sheet label { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
                 color: var(--ink-faint); text-transform: uppercase; margin: 14px 0 6px; }
  .sheet input, .sheet select {
    width: 100%; background: #0e0e10; border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px; font-size: 13px; outline: none;
  }
  .sheet .row { display: flex; gap: 9px; margin-top: 18px; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 14px);
    z-index: 80; background: var(--ink); color: #0b0b0c;
    padding: 11px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    max-width: 88vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { background: var(--accent); color: #fff; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
    .body { padding: 12px; }
    .name { font-size: 14px; }
    .desc, .prompt { display: none; }
    main { padding: 16px 12px 70px; }
    .bar { padding: 12px 12px 0; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brandrow">
      <h1 class="wordmark">咒語盒 · 海報牆</h1>
      <span class="ver" id="ver"></span>
      <span class="tagline" id="count"></span>
      <span class="spacer"></span>
      <button class="ghost" id="onlyShot">只看已生成</button>
      <button class="ghost" id="openSettings">⚙ 設定</button>
    </div>
    <div class="controls">
      <input class="field" id="subject" placeholder="主題（選填）— 例：一隻黑貓坐在窗邊。填了會套用到「風格句」那類卡片" />
      <input class="field" id="search" placeholder="搜尋名稱、分類或提示詞…" />
    </div>
    <div class="face">
      <img id="facePreview" alt="" />
      <label class="face-btn" for="faceInput">＋ 上傳照片</label>
      <input id="faceInput" type="file" accept="image/*" hidden />
      <button id="faceClear" class="face-clear" type="button">移除</button>
      <span id="faceHint" class="face-hint"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="end" id="end"></div>
</main>

<div class="scrim" id="lightbox">
  <div class="lightbox">
    <img id="lightboxImg" alt="" />
    <div class="row">
      <button class="btn primary" id="downloadBtn">⬇ 下載原圖</button>
      <button class="btn" id="regenBtn">重新生成</button>
      <button class="btn" id="closeLightbox">關閉</button>
    </div>
  </div>
</div>

<div class="scrim" id="settings">
  <div class="sheet">
    <h2>生成設定</h2>
    <p>
      用預設的 <b>Pollinations（免費・免金鑰）</b>不用填任何東西，直接就能生圖。
      下面的金鑰只有在你選付費層的 gemini／imagen 模型時才需要——金鑰只存在這台裝置的瀏覽器裡，
      直接送到 Google，不經過任何中間伺服器。
    </p>
    <label>Google API Key（只有付費層模型才需要）</label>
    <input id="keyInput" type="password" placeholder="AIza…（選付費層 Google 模型時才要填）" />
    <label>模型</label>
    <select id="modelInput">
      <option value="pollinations">免費・免金鑰 · Pollinations（直接出圖，推薦）</option>
      <option value="gemini-2.5-flash-image">付費層 · gemini-2.5-flash-image（一張約 US$0.039，可套上傳照片）</option>
      <option value="imagen-4.0-generate-001">付費層 · imagen-4.0-generate-001（一張約 US$0.04）</option>
      <option value="gemini-2.0-flash-preview-image-generation">付費層 · gemini-2.0-flash-preview-image-generation（舊版）</option>
    </select>
    <button class="btn" id="detectModels" type="button" style="margin-top:8px;flex:none;width:100%">偵測可用 Google 模型</button>
    <p style="margin:8px 0 0;font-size:11px;line-height:1.7;color:var(--ink-faint)">
      <b>Pollinations＝免費、免金鑰、直接出圖</b>，開箱即用（公用服務，忙碌時可能慢或要重按）。<br>
      ⚠️ Google API 的<b>免費層無法生圖</b>（官方定價所有圖片模型免費方案都「無法使用」）；
      gemini／imagen 這些要在 Google Cloud 綁卡改<b>付費層</b>才會動，但畫質較好、能用上傳照片套風格。
    </p>
    <label>畫面比例</label>
    <select id="ratioInput">
      <option value="3:4">3:4 — 海報直式</option>
      <option value="1:1">1:1 — 方形</option>
      <option value="4:3">4:3 — 橫式</option>
      <option value="9:16">9:16 — 手機直式</option>
      <option value="16:9">16:9 — 寬螢幕</option>
    </select>
    <div class="row">
      <button class="btn primary" id="saveSettings">儲存</button>
      <button class="btn" id="clearImages">清空所有生成圖</button>
      <button class="btn" id="closeSettings">關閉</button>
    </div>
  </div>
</div>

<div id="toast"></div>

p eyes with the background melting into smooth bokeh. Single soft key light from one side with a fill card lifting the shadows. Skin keeps real pores and a faint natural sheen — never plastic. Muted filmic grade with slightly teal shadows and warm golden highlights.","g":"攝影寫實","f":0},{"i":"s-softbox","t":"柔光棚拍","s":"Softbox Studio","d":"","p":"Professional studio lighting: large softbox at 45 degrees above the subject, two fill lights killing hard shadows, seamless neutral grey backdrop. Clean, even light, crisp subject edges, accurate exposure with no crushed blacks or blown highlights. Commercial-ready.","g":"攝影寫實","f":0},{"i":"s-golden-hour","t":"黃金時刻","s":"Golden Hour","d":"","p":"Golden hour daylight half an hour before sunset: low sun raking from behind the subject, rimming hair and shoulders in gold, a touch of haze and lens flare in frame. Fine dust floats in the light beam. Warm orange grade, soft shadows stretched long.","g":"攝影寫實","f":0},{"i":"s-bw-film","t":"黑白底片","s":"Black & White Film","d":"","p":"Classic black and white film photography: visible ISO 400 silver grain, rich midtone separation, deep blacks that still hold shadow detail, clean whites that never clip. Composition carried by shape, line and contrast instead of colour. Quiet documentary feel.","g":"攝影寫實","f":0},{"i":"s-fuji-film","t":"日系底片","s":"Japanese Film Stock","d":"","p":"Japanese film stock grade: lifted exposure, low contrast, cool whites, cyan-leaning greens, clean slightly pink skin tones. Airy composition with generous negative space, diffused overcast or window light, no harsh shadows. Fine grain and a whisper of vignetting.","g":"攝影寫實","f":0},{"i":"s-macro","t":"微距特寫","s":"Macro Close-up","d":"","p":"Macro photography at 1:1 magnification: depth of field only millimetres deep, texture, fibres, droplets and fine hairs rendered in forensic detail on the focal plane, everything else dissolving. Ring or soft side light to model the surface, background reduced to pure bokeh colour.","g":"攝影寫實","f":0},{"i":"s-aerial","t":"空拍俯瞰","s":"Aerial Top-down","d":"","p":"Drone shot straight down: a true 90-degree top-down view flattening roads, fields, rooftops and crowds into graphic geometry. Afternoon sun casts short crisp shadows that give the frame rhythm. Wide but undistorted, vast and orderly.","g":"攝影寫實","f":0},{"i":"s-long-exposure","t":"長曝流光","s":"Long Exposure","d":"","p":"Long exposure photography at thirty seconds: everything that moves becomes a trail — headlights stretched into red and white ribbons, water smoothed to silk, clouds smeared into direction — while buildings and ground stay absolutely sharp. Tripod-steady, clean noise-free shadows.","g":"攝影寫實","f":0},{"i":"s-neon-night","t":"霓虹夜街","s":"Neon Night Street","d":"","p":"Night street photography after rain: neon signage in hot pink, electric blue and cyan reflecting off wet asphalt, puddles stretching the light into streaks. The subject is sandwiched between coloured ambient light, half the face red and half blue. Light haze turns distant lamps into soft orbs.","g":"攝影寫實","f":0},{"i":"s-silhouette","t":"逆光剪影","s":"Backlit Silhouette","d":"","p":"Strong backlit silhouette: the light source faces the camera, the subject reduced to a near-black shape read purely by outline, all interior detail sacrificed. Background is a broad luminous sky or window with a clean gradient. Minimal composition carried by the pose alone.","g":"攝影寫實","f":0},{"i":"s-product-studio","t":"商品棚拍","s":"Product Shot","d":"","p":"High-end product photography: pure white or gradient backdrop, the product floating or standing on a soft reflective surface with a clean mirrored reflection beneath. Softbox plus a narrow strip light carving edge highlights. Label text legible; metal, glass and matte finishes rendered accurately.","g":"攝影寫實","f":0},{"i":"s-food-flatlay","t":"美食俯拍","s":"Food Flat Lay","d":"","p":"Overhead food flat lay: straight-down view with plates, ingredients and linen arranged geometrically across the frame with considered negative space. Natural side light from a window makes sauces glisten, steam visible, crumb structure legible. Saturated but honest colour, texture over decoration.","g":"攝影寫實","f":0},{"i":"s-teal-orange","t":"青橙大片","s":"Teal & Orange","d":"","p":"Hollywood blockbuster grade: skin tones and highlights pushed warm orange, shadows and background pulled deep teal for a hard complementary contrast. Widescreen framing with letterbox bars, high contrast, dense blacks, subtle anamorphic flare and film grain.","g":"電影感","f":0},{"i":"s-hk-neon","t":"港片霓虹","s":"Hong Kong Neon","d":"","p":"Nineties Hong Kong cinema look: overall green fluorescent cast mixed with red signage bleeding through the window. Cramped interiors, light sliced by blinds and a ceiling fan, humid and smoky. Slight handheld drift, heavy dirty colour, pronounced film grain.","g":"電影感","f":0},{"i":"s-nordic-cold","t":"北歐冷調","s":"Nordic Cold","d":"","p":"Nordic drama grade: extremely low saturation reduced to greys, blues and pale browns with cool whites. Directionless overcast light, shallow shadows. Wide empty compositions with the figure pushed to the edge of frame. Restrained, distant mood.","g":"電影感","f":0},{"i":"s-western","t":"西部膠捲","s":"Spaghetti Western","d":"","p":"Spaghetti western film stock: everything dyed dusty yellow-brown, sky blown out to white, horizon pressed low. Harsh midday toplight carving deep facial shadows. Visible film scratches, dust specks and heavy vignetting — coarse and sun-scorched.","g":"電影感","f":0},{"i":"s-cyberpunk","t":"賽博龐克","s":"Cyberpunk","d":"","p":"Cyberpunk film scene: a perpetually raining high-density future city, giant holographic ads projected across tower facades, magenta and cyan neon the only light sources. Steam and particulate in the air, standing water mirroring the signage above. High contrast, dense shadows, blooming highlights.","g":"電影感","f":0},{"i":"s-horror","t":"恐怖片氛圍","s":"Horror Mood","d":"","p":"Low-key horror atmosphere: most of the frame sunk in darkness, a single cold white shaft of light from an unseen source cutting across the subject. Extreme contrast with unreadable shapes lurking in shadow. Colour nearly drained to a sickly green-cyan. Faint handheld drift and noise.","g":"電影感","f":0},{"i":"s-wes-symmetry","t":"對稱糖果色","s":"Symmetric Pastel","d":"","p":"Rigidly symmetrical head-on composition: subject dead centre, left and right mirrored, camera perfectly level. A deliberately curated pastel palette — mustard, pink, mint and pale blue — evenly saturated. Flat frontal lighting with no dramatic shadow, like an immaculately dressed dollhouse.","g":"電影感","f":0},{"i":"s-cel-anime","t":"日系賽璐璐","s":"Cel-shaded Anime","d":"","p":"Modern Japanese anime cel shading: clean confident black linework, flat colour fills, shadows in one or two hard-edged steps with no gradients. Large luminous eyes with layered highlights. Painterly watercolour background contrasting against the flat character art.","g":"動漫","f":0},{"i":"s-retro-anime","t":"九〇年代動畫","s":"90s Anime","d":"","p":"Nineties hand-painted cel animation: slightly uneven inked lines, muted period colour palette, mild colour shift and grain from film transfer. Narrower faces and longer eyes, airbrushed soft-edged shading. 4:3 frame with a hint of scan-gate wobble at the edges.","g":"動漫","f":0},{"i":"s-shoujo","t":"少女漫畫","s":"Shoujo Manga","d":"","p":"Shoujo manga style: slender elongated figures, eyes taking up a huge share of the face with elaborate starbursts and reflections in the iris. Fine delicate linework, backgrounds strewn with petals, bubbles and screentone effects. Sweet translucent colour, emotion over realism.","g":"動漫","f":0},{"i":"s-shonen","t":"熱血少年漫","s":"Shonen Action","d":"","p":"Shonen action spread: exaggerated perspective and low camera angles, defined musculature, poses full of torque. Radial speed lines exploding from the centre, debris and energy effects at the point of impact. Heavy black outlines over high-contrast colour, emotion at maximum.","g":"動漫","f":0},{"i":"s-pastoral-anime","t":"田園手繪動畫","s":"Pastoral Hand-drawn","d":"","p":"Hand-painted feature-animation look: backgrounds in layered watercolour and gouache with visible brushwork in grass, clouds and water. Warm gentle daylight, lush greens. Rounded unfussy character linework and simple designs set against the dense painted background. Quiet, healing mood.","g":"動漫","f":0},{"i":"s-manga-bw","t":"黑白網點漫畫","s":"Screentone Manga","d":"","p":"Black and white manga page: no colour at all, every midtone rendered as screentone with a visible regular dot grid. Dip-pen linework with strong thick-to-thin variation, heavy spot blacks, whites reserved for highlights. Strong panel sensibility, mood carried by effect lines and focus lines.","g":"動漫","f":0},{"i":"s-chibi","t":"Q版大頭","s":"Chibi","d":"","p":"Chibi two-head-tall proportions: the head about half the total height, short rounded limbs, hands and feet simplified into soft nubs. Features clustered low on the face, huge bright eyes, blushed cheeks. Rounded linework with no sharp corners, bright saturated colour, clean or flat-colour background. Sticker-ready.","g":"動漫","f":0},{"i":"s-picture-book","t":"童書水彩","s":"Picture Book Watercolour","d":"","p":"Children’s picture-book watercolour: pigment blooming naturally on paper with darker settling at the edges, the cold-press paper tooth clearly visible. Warm gentle palette, negative space left as bare paper. Simplified charming shapes over loose pencil or fine ink linework, precision deliberately avoided.","g":"插畫手繪","f":0},{"i":"s-crayon","t":"蠟筆塗鴉","s":"Crayon Doodle","d":"","p":"Children’s crayon drawing: waxy sticks laid over rough paper leaving broken uneven patches, dense where pressed hard, showing bare white where skimmed. Wobbly imprecise lines, shapes reduced to their simplest form. Saturated primaries used straight from the box with no blending — naive and alive.","g":"插畫手繪","f":0},{"i":"s-flat-vector","t":"平塗向量","s":"Flat Vector","d":"","p":"Flat vector illustration: built from solid colour shapes with no gradients and no realistic shadow, depth conveyed only by tints of the same hue. Geometric forms with perfectly crisp edges, either no outline or a uniform hairline. Palette held to four or five colours. Modern and clean.","g":"插畫手繪","f":0},{"i":"s-line-sketch","t":"線稿速寫","s":"Line Sketch","d":"","p":"Single-colour line sketch: line only, no fills and no shading. Fast continuous strokes laid down in one pass without correction, weight varying naturally with speed. Very generous white space, the whole form and gesture implied by a handful of decisive lines. Clean and confident.","g":"插畫手繪","f":0},{"i":"s-woodcut","t":"木刻版畫","s":"Woodcut Print","d":"","p":"Woodcut relief print: coarse gouge marks with lines that swell, break and taper. Two or three inks only, with slight registration offset creating overlap at the edges. Tone built from dense parallel and cross-hatched cuts, ink pressed unevenly into the paper.","g":"插畫手繪","f":0},{"i":"s-ink-wash","t":"水墨渲染","s":"Ink Wash","d":"","p":"Freehand ink wash: gradations of ink bleeding into absorbent paper, a single stroke carrying the full range from scorched black to pale grey. Large areas left blank to stand for mist and water. Expressive brush pressure, forms suggested rather than described, with one accent of cinnabar red.","g":"插畫手繪","f":0},{"i":"s-pencil","t":"鉛筆素描","s":"Pencil Drawing","d":"","p":"Academic graphite drawing: the full five-value range built with pencils from 2H to 6B, hatching following the turn of the form. Highlights lifted with a kneaded eraser, shadows layered rather than smothered. Paper tooth visible in the light passages, structure anatomically accurate.","g":"插畫手繪","f":0},{"i":"s-pastel-soft","t":"粉彩柔霧","s":"Soft Pastel","d":"","p":"Soft pastel on paper: pigment blended with the fingertip, edges feathered into haze with no sharp contour. Colours layered and smudged into each other with a faint chalk dust. High-key and low-saturation overall, light diffused as if through gauze. Tender and soft-focus.","g":"插畫手繪","f":0},{"i":"s-impressionist","t":"印象派油畫","s":"Impressionist Oil","d":"","p":"Impressionist oil painting: short loaded brushstrokes laid side by side, colours mixing in the eye rather than on the palette. The subject is the light of one particular moment rather than the object itself; shadows are violet-blue, never black. Loose contours, detail abandoned, the image resolving only at a distance.","g":"藝術流派","f":0},{"i":"s-renaissance","t":"文藝復興油畫","s":"Renaissance Oil","d":"","p":"High Renaissance oil painting: luminous flesh tones built in transparent glazes, light entering from a single high window with exquisitely graded transitions. Composed dignified pose, drapery folds studied and material-accurate. Deep umber background, the surface carrying fine craquelure and the yellow cast of aged varnish.","g":"藝術流派","f":0},{"i":"s-baroque","t":"巴洛克光影","s":"Baroque Chiaroscuro","d":"","p":"Baroque chiaroscuro: most of the canvas sunk into near-total black, a single hard shaft of light entering from the upper left and striking the subject, the boundary rendered at extreme contrast. Poses full of movement and theatrical tension, drapery in flight. Palette of warm browns, ochre reds and ivory.","g":"藝術流派","f":0},{"i":"s-ukiyoe","t":"浮世繪","s":"Ukiyo-e","d":"","p":"Ukiyo-e woodblock print: black keyblock outlines enclosing flat colour fields, no perspective depth and no realistic shading. Prussian blue laid in banded gradients for sky and water. Bold composition with the subject often cropped by the frame edge, cloud patterns and a signature cartouche in the open space.","g":"藝術流派","f":0},{"i":"s-art-nouveau","t":"新藝術裝飾","s":"Art Nouveau","d":"","p":"Art Nouveau decorative style: flowing organic whiplash curves running through the whole composition, vines, hair and drapery merging into one continuous line. The subject enclosed in a circular or arched decorative frame carrying dense floral ornament. Muted earthy palette with generous gold outlining, symmetrical and flattened.","g":"藝術流派","f":0},{"i":"s-cubism","t":"立體派","s":"Cubism","d":"","p":"Cubism: the subject fractured into geometric planes, front, side and back views presented simultaneously and collaged onto one surface. Space flattened so foreground and background interlock. Palette restricted to ochre, grey-green and umber, brushwork blocky, boundaries cut with straight edges.","g":"藝術流派","f":0},{"i":"s-surreal","t":"超現實主義","s":"Surrealism","d":"","p":"Surrealism: impossible scenes rendered with meticulous realist technique — objects floating, scale dislocated, ordinary things appearing where they cannot belong. Deep empty space with a clear horizon, light direction and cast shadows that refuse to agree. Silent and quietly unsettling.","g":"藝術流派","f":0},{"i":"s-pointillism","t":"點描派","s":"Pointillism","d":"","p":"Pointillism: the entire image built from countless discrete dots of unmixed pigment, the colour combining only on the retina. Complementary dots placed side by side to make the surface vibrate. Up close an ocean of dots; step back and form and light assemble themselves.","g":"藝術流派","f":0},{"i":"s-abstract-expr","t":"抽象表現","s":"Abstract Expressionism","d":"","p":"Abstract expressionism: representation abandoned entirely, emotion recorded directly through pouring, dripping and full-arm brushwork. Paint varying from thick impasto ridges to thin running washes. All-over composition with no focal centre, colours clashing at full strength.","g":"藝術流派","f":0},{"i":"s-claymation","t":"黏土定格","s":"Claymation","d":"","p":"Stop-motion claymation: everything sculpted by hand in plasticine, surfaces holding fingerprints, tool marks and small irregularities. Rounded chunky forms with exaggerated proportions. Soft studio lighting, shallow depth of field, physically built miniature set where the cardboard and fabric are visible as such.","g":"3D · 立體","f":0},{"i":"s-3d-cartoon","t":"圓潤3D動畫","s":"Rounded 3D Animation","d":"","p":"Feature-quality 3D animation render: rounded appealing forms with no sharp corners, large moist eyes carrying layered reflections. Subsurface scattering letting light through skin and ears, hair simulated strand by strand. Global illumination base with a warm rim light. Clean, bright, finely detailed.","g":"3D · 立體","f":0},{"i":"s-isometric","t":"等距小場景","s":"Isometric Diorama","d":"","p":"Isometric miniature diorama: 45-degree axonometric projection with no perspective convergence, parallel lines staying parallel at any depth. The whole scene contained on a rounded cube or floating island with cleanly cut edges. Tiny precise props, bright colour, soft ambient light with gentle occlusion.","g":"3D · 立體","f":0},{"i":"s-figure","t":"公仔盲盒","s":"Designer Toy","d":"","p":"Designer vinyl toy product shot: matte PVC paint with a fine even micro-texture and a clean parting line. Two-head-tall proportions, forms heavily simplified. Staged on a clean display plinth under a light tent with a soft contact shadow beneath — an official product listing image.","g":"3D · 立體","f":0},{"i":"s-glass","t":"玻璃質感","s":"Glass Render","d":"","p":"Glass material render: the subject cast in solid translucent glass, light refracting through it with dispersion and caustic patterns, the background visible and warped inside the form. Colour dense where the glass is thick, near-clear where it thins. Crisp specular highlights, minimal background so the transmission reads.","g":"3D · 立體","f":0},{"i":"s-lowpoly","t":"低多邊形","s":"Low Poly","d":"","p":"Low poly 3D: forms built from a small number of triangular facets, each face flat-shaded in a single colour with the edges between them clearly visible and no smoothing at all. Bright colour in distinct steps, faceted like folded paper. Background handled in the same large polygonal blocks.","g":"3D · 立體","f":0},{"i":"s-felt","t":"羊毛氈","s":"Needle Felt","d":"","p":"Needle-felted wool: the surface covered in soft fuzzy fibres, edges downy rather than crisp, tiny dimples left by the felting needle visible throughout. Dyed-yarn colours, gentle and never harsh. Plump naive forms with fibres blending naturally at the joins — warm, with the imperfection of handwork.","g":"3D · 立體","f":0},{"i":"s-papercraft","t":"紙藝摺紙","s":"Papercraft","d":"","p":"Layered papercraft scene: every element cut, scored and folded from cardstock with visible crease lines, cut edges and paper thickness. Depth built from stacked layers casting soft shadows onto each other. Matte non-reflective paper surface, colours taken straight from a standard craft-paper range.","g":"3D · 立體","f":0},{"i":"s-vaporwave","t":"蒸汽波","s":"Vaporwave","d":"","p":"Vaporwave aesthetic: a magenta-to-violet gradient sky, a huge banded sun sitting on the horizon, an infinite cyan wireframe grid for ground. Classical plaster busts, palm trees and early GUI windows scattered through. Oversaturated colour with VHS scanlines and chroma bleed.","g":"復古懷舊","f":0},{"i":"s-90s-mag","t":"九〇年代雜誌","s":"90s Magazine","d":"","p":"Nineties magazine spread: direct on-camera flash blowing the subject flat and dropping a hard black shadow right behind them. Warm yellow-leaning colour, halftone rosettes visible on close inspection, paper slightly yellowed. Blunt unfussy framing with the coarse confidence of the era.","g":"復古懷舊","f":0},{"i":"s-old-photo","t":"泛黃老照片","s":"Faded Photograph","d":"","p":"A photograph left in a drawer for decades: faded to a yellow-brown cast, contrast lowered, shadows gone grey, water staining and creases at the corners. Fine scratches and white speckling across the surface, a white print border all round. Stiff formal poses, as if taken at a portrait studio.","g":"復古懷舊","f":0},{"i":"s-retro-poster","t":"復古印刷海報","s":"Vintage Print Poster","d":"","p":"Mid-century travel poster printing: three or four flat lithographic inks with slight registration offset between plates. Muted mustard, brick red, teal and cream palette. Forms reduced to simplified geometric blocks, skies handled as banded gradients, an even coarse grain across the paper.","g":"復古懷舊","f":0},{"i":"s-pixel","t":"像素藝術","s":"Pixel Art","d":"","p":"Pixel art: resolution deliberately kept low, every pixel visible and grid-aligned with no anti-aliasing whatsoever. Palette limited to sixteen colours, gradients faked with dithering. Dark outline pixels, highlights of only one or two cells, the whole form communicated within a tiny grid.","g":"復古懷舊","f":0},{"i":"s-vhs","t":"VHS 錄影帶","s":"VHS Tape","d":"","p":"VHS tape transfer quality: horizontal scanlines clearly visible, chroma bleeding past edges into red and blue ghosting, occasional tracking jumps and noise bars. Low resolution with detail smeared, coloured noise crawling in the shadows. A timestamp overlay burned into the corner.","g":"復古懷舊","f":0},{"i":"s-minimal","t":"極簡留白","s":"Minimalist","d":"","p":"Minimalist composition: over ninety percent of the frame left empty, the subject placed small and precisely so the negative space does the work. Two colours only, one of them the background. No ornament, no texture, clean edges, everything unnecessary removed.","g":"平面設計","f":0},{"i":"s-brutalist","t":"粗野排版","s":"Brutalist Type","d":"","p":"Brutalist graphic design: oversized grotesque sans-serif type filling the layout and running off the edge. Elements deliberately misaligned, overlapped and crudely snapped. Black and white plus a single fluorescent accent. No rounded corners, no shadows, hierarchy built purely from extreme size contrast.","g":"平面設計","f":0},{"i":"s-memphis","t":"孟菲斯","s":"Memphis Design","d":"","p":"Memphis design: asymmetric geometric shapes scattered without a grid, mixed with squiggles, dots, waves and diagonal stripes. High-saturation primaries alongside pink and black-and-white checkerboard, clashing but playful. No perspective and no shadow — pure flat ornament.","g":"平面設計","f":0},{"i":"s-bauhaus","t":"包浩斯幾何","s":"Bauhaus","d":"","p":"Bauhaus composition: circle, triangle and square only, in red, yellow and blue plus black and white. Elements placed on a strict grid with calculated proportion. Uniform heavy black rules. Rational, balanced and function-led, with no ornament at all.","g":"平面設計","f":0},{"i":"s-collage","t":"雜誌拼貼","s":"Magazine Collage","d":"","p":"Hand-cut magazine collage: fragments torn from different printed sources layered on top of each other, each with a ragged torn edge or a hard scissor cut and a shadow onto the piece below. The sources disagree in halftone, tone and era — deliberately mismatched. Marker scrawls and circling over the top.","g":"平面設計","f":0},{"i":"s-infographic","t":"資訊圖表","s":"Infographic","d":"","p":"Infographic illustration: presented as a cutaway or exploded diagram with leader lines and labelled callouts. Precise uniform line weights, restrained colour assigned by function rather than taste. Clean background, layout ordered by reading sequence, key elements marked with a single accent colour.","g":"平面設計","f":0},{"i":"s-papercut","t":"剪紙層疊","s":"Layered Papercut","d":"","p":"Multi-layer papercut: five to seven cut paper planes arranged front to back with air between them, light entering from behind and to one side casting soft graded shadows layer onto layer. Outlines are finely fretted silhouettes; the further back a layer sits the darker and simpler it becomes.","g":"材質工藝","f":0},{"i":"s-embroidery","t":"刺繡布藝","s":"Embroidery","d":"","p":"Hand embroidery: the image built stitch by stitch in floss, individual threads readable by direction, sheen and slight relief above the surface. Ground fabric a coarse-weave linen or canvas. Satin stitch filling the shapes, backstitch outlining them, tiny fibres fraying at the edges — thick and warm.","g":"材質工藝","f":0},{"i":"s-neon-tube","t":"霓虹燈管","s":"Neon Tube","d":"","p":"Real neon tubing: the image formed from one continuously bent glass tube of even width with rounded corners, mounting brackets and wiring visible. The tube core burns white and blooms outward into saturated colour, throwing a halo onto the wall behind. Dark brick or unlit room as background.","g":"材質工藝","f":0},{"i":"s-liquid-metal","t":"液態金屬","s":"Liquid Metal","d":"","p":"Liquid metal material: a perfect mirror surface carrying a warped reflection of the whole environment and no local colour of its own. The form flows like mercury, pulled into rounded surface-tension curves with small separating droplets. Specular highlights blindingly sharp, shadows filled with cool reflected environment.","g":"材質工藝","f":0},{"i":"s-ice-crystal","t":"冰雕水晶","s":"Ice & Crystal","d":"","p":"Ice and crystal material: translucent mass shot through with fine bubbles and internal fractures, light refracting along the edges and scattering pale blue inside. A thin layer of frost across the surface with clear patches where it has been touched. Blade-sharp edges, the whole form glowing when backlit.","g":"材質工藝","f":0},{"i":"s-miniature","t":"微縮模型","s":"Tilt-shift Miniature","d":"","p":"Tilt-shift miniature effect: a real scene viewed from high up with only a narrow horizontal band in focus, blurring away sharply above and below. Saturation and contrast pushed so genuine buildings and crowds read as plastic model toys. Light as clean as a studio set.","g":"材質工藝","f":0},{"i":"s-temple","t":"廟宇彩繪","s":"Temple Painting","d":"","p":"Taiwanese temple decorative painting: an intense palette of cinnabar red, gold leaf, indigo and jade green, contours raised in relief with gilded piping. Dense symmetrical ornament packed with auspicious clouds, dragons, phoenixes and floral scrollwork. Aged flaking on the timber, darkened by decades of incense — heavy and solemn.","g":"東方 · 在地","f":0},{"i":"s-shanshui","t":"水墨山水","s":"Shan Shui Landscape","d":"","p":"Traditional shan shui landscape: rock texture and mass built with cun brush strokes, distant peaks suggested with a single pale wash, mist rendered purely as untouched paper. Composed in shifting perspective so the eye travels through rather than stands still. Pines, a pavilion and a lone boat placed tiny to make the mountains vast.","g":"東方 · 在地","f":0},{"i":"s-gongbi","t":"工筆重彩","s":"Gongbi Fine Brush","d":"","p":"Gongbi fine-brush painting: contours drawn in exacting hairline ink, then built up in repeated washes of mineral pigment, dense and opaque. Azurite, malachite, cinnabar and gold dominate; drapery folds and petals graded layer by layer. Warm cream silk ground behind.","g":"東方 · 在地","f":0},{"i":"s-tw-signage","t":"台式復古招牌","s":"Taiwan Retro Signage","d":"","p":"Old Taiwanese street signage: hand-lettered clerical or gothic acrylic characters, white on red or black on yellow, edges sun-bleached and rust-bitten. Corrugated metal, terrazzo flooring and mosaic tile as the material vocabulary. Cold fluorescent tube light, power cables crossing overhead.","g":"東方 · 在地","f":0},{"i":"s-wafu","t":"和風紋樣","s":"Japanese Wafu","d":"","p":"Japanese wafu design: traditional seigaiha, asanoha and shippo patterns laid as ground, composition weighted to one side with considered empty space. Colours drawn from traditional names — ainezu, hanezu, moegi, sumi. Gold leaf scattered in irregular fragments, washi fibre texture across the surface.","g":"東方 · 在地","f":0},{"i":"s-night-market","t":"夜市寫實","s":"Night Market","d":"","p":"Taiwanese night market on location: a canopy of warm tungsten bulbs mixed with cold fluorescent tubes overhead, steam and cooking smoke churning through the beams. Stall signage, plastic stools, stainless steel counters and red plastic bowls crowding the frame. Motion-blurred crowd, colour chaotic and saturated, thick with everyday life.","g":"東方 · 在地","f":0},{"i":"s-dark-fantasy","t":"暗黑奇幻","s":"Dark Fantasy","d":"","p":"Dark fantasy concept art: a heavy overcast sky pressed low, a single cold shaft breaking through the cloud as the only light. Armour, ruins and dead branches rendered with dense material detail, everything soaked in rain and mud. Colour nearly drained to grey-blue and rust, scale exaggerated to dwarf the figure.","g":"暗黑奇幻","f":0},{"i":"s-gothic","t":"哥德陰影","s":"Gothic","d":"","p":"Gothic style: pointed arches, stained glass and dense stone tracery framing the scene, vertical lines dragging the eye upward. Candlelight and moonlight the only sources, shadows deep with soft boundaries. Palette of black, deep violet and oxblood — ornate but sombre.","g":"暗黑奇幻","f":0},{"i":"s-steampunk","t":"蒸汽龐克","s":"Steampunk","d":"","p":"Steampunk: Victorian machinery in brass, rosewood and leather, gears, pressure gauges, rivets and copper piping exposed and plausibly functional. Steam venting from valves. Warm brown and burnished-metal palette lit by the orange of gaslight, the frame dense with industrial texture.","g":"暗黑奇幻","f":0},{"i":"s-space-opera","t":"太空歌劇","s":"Space Opera","d":"","p":"Space opera scene: a vast ship or planet occupying one corner to establish scale, a richly coloured nebula and dense starfield behind. Light from a distant sun giving hard-edged highlights against absolutely black shadows, because vacuum scatters nothing. Immense and silent.","g":"暗黑奇幻","f":0},{"i":"s-dreamy-pastel","t":"夢幻粉彩","s":"Dreamy Pastel","d":"","p":"Dreamy pastel grade: the whole palette diluted to lilac, blush, sky blue and cream bleeding into each other, with no pure black and no pure white. Light so soft it has no direction, edges blooming into halation. Small motes and bubbles drifting through the frame, like a nap you never quite wake from.","g":"夢幻清新","f":0},{"i":"s-forest-light","t":"森林系自然光","s":"Forest Daylight","d":"","p":"Forest daylight: sun filtering through layers of leaves and dappling the ground and the subject, the beams made visible by pollen in the air. Greens carrying a full range from yellow-green to deep pine, shadows luminous green rather than grey. Humid air with light mist in the distance.","g":"夢幻清新","f":0},{"i":"s-aurora","t":"極光夢境","s":"Aurora Dream","d":"","p":"Aurora night sky: curtains of green and violet light falling and twisting overhead, bright enough to illuminate snow on the ground and its reflection in still water. Stars showing through the gaps. The landscape reduced to a deep blue silhouette, colour temperature ice-cold, the aurora the only warm complement.","g":"夢幻清新","f":0},{"i":"s-dried-flower","t":"乾燥花柔霧","s":"Dried Flower Haze","d":"","p":"Dried-flower haze grade: saturation pulled down, blacks lifted into grey mist, the whole image tinted beige and dusty pink. Light filtered through a curtain, soft and even, contrast very low. Paper-like grain across the frame with a slight light leak — quiet, dry, faintly nostalgic.","g":"夢幻清新","f":0},{"i":"h01","t":"標準證件照","s":"","d":"證件 · 白底 · 正式","p":"ID photo of a age-year-old gender, pure white seamless background, facing camera directly, subtle natural smile, dark suit jacket with white shirt, soft even frontal studio lighting, no harsh shadows, realistic skin texture, sharp facial detail, head-and-shoulders crop, passport format.","g":"大頭照·證件照","f":1},{"i":"h02","t":"LinkedIn 專業大頭照","s":"","d":"職場 · 淺灰底 · 可信","p":"Professional LinkedIn headshot of a profession, light grey gradient backdrop, three-quarter body angle with eyes to camera, confident approachable expression, softbox key light with reflector fill, 85mm lens at f/2.0 shallow depth of field, natural unretouched skin texture, business casual attire.","g":"大頭照·證件照","f":1},{"i":"h03","t":"戶外自然光大頭照","s":"","d":"戶外 · 逆光 · 溫暖","p":"Outdoor portrait of subject, park at golden hour blurred into soft bokeh, backlight creating a rim light on the hair, face filled with warm bounced light, relaxed genuine smile, 135mm telephoto compression, warm color grade, natural and candid.","g":"大頭照·證件照","f":1},{"i":"h04","t":"黑白經典人像","s":"","d":"黑白 · 林布蘭光 · 質感","p":"Classic black and white portrait close-up, Rembrandt lighting forming a triangle of light on the cheek, deep grey background, steady gaze, head-and-shoulders framing, high detail i
